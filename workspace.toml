# workspace.toml
#
# Declared-intent coordination artifact for this repo.
# Each initiative gets its own named section. Run `workspace-status` to surface
# ready items, blocked items, and active signals — or to initialise this file
# with your first initiative and the full schema.
#
# Queue entries are strings (no deps) or inline objects
# {path/slug, needs?, source?, summary?, type?}. `summary` is a short one-line label
# that workspace-status renders as the item's title; a fuller `#` comment below an
# entry can carry cold-start detail. `needs` uses queue-prefix notation:
#   "work:<path>"      — depends on a work queue entry
#   "shape:<slug>"     — depends on a shaping queue entry
#   "research:<slug>"  — depends on a research entry
#   "brief:<path>"     — depends on a brief queue entry
#   "backlog:<slug>"   — depends on a repo-level [backlog] item
#
# The [backlog] section below tracks open work not yet scoped to an initiative.
# Add items as: {slug = "my-deferred-item", summary = "one-line label"}
# When a backlog item is blocked by another tracked item, encode it as a `needs`
# edge (e.g. {slug = "b", needs = "backlog:a"}) — not just a prose comment.
# Run `workspace-status` to see all open backlog items.

[backlog]
# A fully metadata-safe dirty/untracked check needs a reviewed manifest or a
# non-Git source-state protocol; do not execute worktree-inspecting Git commands
# against an untrusted checkout without that design decision.
open = [
  {slug = "engram-worktree-metadata-safe-preflight", source = "spec/child-math-practice AC13", summary = "Design a Git-metadata-safe local Engram source-state preflight"},
  # Draft research/spec exists at docs/specs/mistake-to-mastery; approve its product assumptions before implementation.
  {slug = "mistake-to-mastery-learning-plan", type = "design", summary = "Shape assessment-driven remediation plans from verified curriculum evidence"},
  # The guidance card's unavailable copy is shared by three distinct
  # conditions: the target left the reviewed catalog, the catalog is empty or
  # failed to load, and a reviewed identity exceeding the transport ceiling.
  # Splitting the wording is a design call deferred from review.
  {slug = "guidance-unavailable-copy-split", source = "spec/performance-guidance AC5", summary = "Split guidance wording across left-catalog, empty-catalog, and oversize identities"},
  # Defense-in-depth guards for a future parent action schema: the parent
  # surface currently accepts the guidance-card component it never emits, and
  # the performance action schema does not cross-check sourceComponentId
  # against rendered card ids. Navigation is browse-tree gated today.
  {slug = "a2ui-action-schema-guards", source = "spec/a2ui-learning-delivery T5", summary = "Tighten A2UI action schema guards if a parent action surface is added"},
  # Observed 2026-08-17 in the terminal assessment state: the header briefly
  # renders "Question 10 of 9" — the position counter is not reset when the
  # completion screen replaces the last question.
  {slug = "assessment-terminal-counter-off-by-one", source = "spec/test-mode-assessment QA", summary = "Reset the question counter when the completion review renders"}
]
