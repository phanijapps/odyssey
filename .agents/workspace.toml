  {slug = "rfc0006-surface-cleanup-css", source = "spec/rfc0006-simplification T5", summary = "Remove dead CSS for removed semantic-search, KG, and 3D-graph surfaces"},
  # Structure v2 (RFC-0007): visual redesign of the student surface per
  # the mockups — the modules/ split landed; the look-and-feel pass remains.
  {slug = "student-surface-visual-redesign", source = "rfc/0007", summary = "Apply the mockup visual language to the student modules (layout pass, not structure)"},
  # RFC-0006 phase 7, declined-for-now with rationale: two files in one
  # git-ignored data/ dir already meet the bar; merge is migration risk.
  {slug = "single-db-merge", type = "design", source = "rfc/0006", summary = "Merge learning + curriculum stores into one database (deferred; low value, real migration risk)"},
  # Deferred from phase 3a: e2e specs still seed Gold by raw SQL; migrate
