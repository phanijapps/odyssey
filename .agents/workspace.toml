  {slug = "engram-worktree-metadata-safe-preflight", source = "spec/child-math-practice AC13", summary = "Design a Git-metadata-safe local Engram source-state preflight"},
  # The v1 mistake-to-mastery spec shipped; this tracks deeper remediation
