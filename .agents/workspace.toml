  {slug = "rfc0006-e2e-seeder-migration", source = "spec/rfc0006-simplification T6", summary = "Migrate e2e Gold seeding to the catalog seeder; remove the seed-off e2e posture"},
  # Pre-existing (round-2 review, not caused by RFC-0006 work): the public
