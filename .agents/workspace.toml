  {slug = "route-table-complete-inventory", source = "review/rfc0006-simplification round 2", summary = "Add parent/admin/performance/suggested-practice routes to the application.md route table"},
  # A fully metadata-safe dirty/untracked check needs a reviewed manifest or a
