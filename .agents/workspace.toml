  {slug = "mistake-to-mastery-learning-plan", type = "design", summary = "Shape deeper assessment-driven remediation plans from verified curriculum evidence"},
  # The guidance card's unavailable copy is shared by three distinct
  # conditions: the target left the reviewed catalog, the catalog is empty or
  # failed to load, and a reviewed identity exceeding the transport ceiling.
  # Splitting the wording is a design call deferred from review.
  {slug = "guidance-unavailable-copy-split", source = "spec/performance-guidance AC5", summary = "Split guidance wording across left-catalog, empty-catalog, and oversize identities"},
]
