name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter child-math-app exec playwright install --with-deps chromium
      - run: pnpm --filter child-math-app exec playwright test --config playwright/atlas.config.ts
      - run: pnpm --filter child-math-app test:e2e
